# Production HTTP vhost template. Certbot may add/manage the HTTPS vhost separately.
<VirtualHost *:80>
    ServerName status.example.com
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog ${APACHE_LOG_DIR}/bf4-status-dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/bf4-status-dashboard-access.log combined
</VirtualHost>
