services:
  bf4-server-watcher:
    build: .
    image: bf4-server-watcher:2.5.1
    container_name: BF4_ServerWatcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVERWATCHER_RUNTIME_DIR: /data
    volumes:
      # Kept for v1.x migration access to legacy config.json/servers.json.
      # v2 runtime configuration is database-backed and does not use JSON.
      - ./:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
