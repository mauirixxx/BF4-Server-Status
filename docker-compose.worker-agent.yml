services:
  bf4-worker-agent:
    build: .
    image: bf4-server-watcher:3.1.0
    container_name: BF4_ServerWatcher_Agent
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      SERVERWATCHER_RUNTIME_DIR: /data
    volumes:
      - ./:/data
    command: ["python3", "worker_agent.py"]
