services:
  bf4-server-watcher:
    build: .
    image: bf4-server-watcher:3.1.2
    container_name: BF4_ServerWatcher
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      SERVERWATCHER_RUNTIME_DIR: /data
    volumes:
      # Runtime directory for .env and persistent version-check cache.
      - ./:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
